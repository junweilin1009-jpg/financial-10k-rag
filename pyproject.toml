[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-10k-rag"
version = "1.0.0"
description = "A filing-grounded RAG assistant for Alphabet, Amazon, and Microsoft 2025 Form 10-Ks."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "faiss-cpu>=1.9,<2",
  "langchain-community>=0.3,<1",
  "langchain-openai>=0.3,<1",
  "langchain-text-splitters>=0.3,<1",
  "openai>=2,<3",
  "pdfplumber>=0.11,<1",
  "python-dotenv>=1,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
financial-rag-chat = "financial_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
