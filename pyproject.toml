[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-10k-rag"
version = "1.0.0"
description = "A filing-grounded RAG assistant for Alphabet, Amazon, and Microsoft 2025 Form 10-Ks."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "faiss-cpu>=1.9,<2",
  "langchain-community>=0.4,<1",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "langchain-text-splitters>=1,<2",
  "openai>=2,<3",
  "pdfplumber>=0.11,<1",
  "python-dotenv>=1,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
financial-rag-chat = "financial_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
